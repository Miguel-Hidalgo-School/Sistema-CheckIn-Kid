<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Chavarria Academy Site | Escáner de Acceso</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <style>
        .scan-line { animation: scanline 2.5s linear infinite; }
        @keyframes scanline { 0% { transform: translateY(-100%); } 100% { transform: translateY(100%); } }
        .micro-pulse { animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .voice-wave span { width: 3px; background-color: currentColor; border-radius: 99px; animation: wave 0.5s infinite alternate; }
        @keyframes wave { from { height: 4px; } to { height: 20px; } }
    </style>
</head>
<body class="bg-white font-sans text-slate-900">
    <main class="max-w-md mx-auto p-6">
        <section class="relative w-full aspect-[4/5] bg-black rounded-3xl overflow-hidden flex items-center justify-center mb-6">
            <div class="scan-line absolute w-full h-0.5 bg-orange-600 shadow-[0_0_15px_rgba(234,88,12,0.8)]"></div>
            <div id="voiceVisualizer" class="opacity-0 transition-opacity absolute inset-0 flex items-center justify-center bg-black/50">
                <div class="flex gap-2 text-white"><span style="animation-delay: 0.1s"></span><span style="animation-delay: 0.3s"></span><span style="animation-delay: 0.2s"></span></div>
            </div>
        </section>

        <button id="voiceBtn" class="w-full bg-orange-600 text-white h-16 rounded-2xl flex items-center justify-center gap-3 font-bold shadow-lg">
            <span class="material-symbols-outlined">mic</span>
            <span id="btnText">Registrar por Voz</span>
        </button>
    </main>

    <script>
        const STUDENTS_DB = {
            'julian': { name: 'Julian Rodriguez', grade: '4º B', img: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' },
            'mistica': { name: 'Mística Rodríguez', grade: '5º B', img: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' },
            'ximena': { name: 'Ximena Vázquez', grade: '6º A', img: 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png' }
        };

        const voiceBtn = document.getElementById('voiceBtn');
        const visualizer = document.getElementById('voiceVisualizer');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        function logAccess(textoCapturado) {
            let query = textoCapturado.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
            
            // Diccionario de correcciones automáticas para errores locos del micrófono
            const aliasMap = {
                'holy and': 'julian',
                'jule an': 'julian',
                'julian': 'julian',
                'julián': 'julian',
                'mistica': 'mistica',
                'ximena': 'ximena'
            };

            // Si el texto capturado está en los errores comunes, lo redirigimos directo a su llave real
            if (aliasMap[query]) {
                query = aliasMap[query];
            }

            let student = null;
            for (let key in STUDENTS_DB) {
                const normalizedKey = key.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
                if (query.includes(normalizedKey) || normalizedKey.includes(query)) {
                    student = STUDENTS_DB[key];
                    break;
                }
            }

            if (student) {
                alert("¡Bienvenido/a " + student.name + "!");
            } else {
                alert("Alumno no encontrado: " + textoCapturado);
            }
        }

        voiceBtn.addEventListener('click', () => {
            if (!SpeechRecognition) return alert("Navegador no compatible.");
            const rec = new SpeechRecognition();
            rec.lang = 'es-MX';
            rec.start();
            visualizer.classList.remove('opacity-0');
            document.getElementById('btnText').textContent = "Escuchando...";

            rec.onresult = (e) => logAccess(e.results[0][0].transcript);
            rec.onend = () => {
                visualizer.classList.add('opacity-0');
                document.getElementById('btnText').textContent = "Registrar por Voz";
            };
        });
    </script>
</body>
</html>
